name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy -p firetv-core -p firetvctl --all-targets -- -D warnings
      - run: cargo test -p firetv-core -p firetvctl

  desktop-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm --prefix apps/desktop ci
      - run: npm --prefix apps/desktop test
      - run: npm --prefix apps/desktop run build

  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-repository.sh
      - run: bash scripts/check-docs.sh
      - run: bash scripts/demo.sh --fixture tests/fixtures/raven-inspection.json
