name: Test Release

on:
  workflow_dispatch:
  push:
    tags: ["v*-test.*"]

permissions:
  contents: write

jobs:
  cli:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
            binary: firetvctl
          - os: windows-latest
            name: windows-x86_64
            binary: firetvctl.exe
          - os: macos-latest
            name: macos-arm64
            binary: firetvctl
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
      - run: cargo build --release -p firetvctl
      - shell: bash
        run: |
          mkdir -p release
          cp "target/release/${{ matrix.binary }}" "release/firetvctl-${{ matrix.name }}${{ matrix.os == 'windows-latest' && '.exe' || '' }}"
      - uses: actions/upload-artifact@v4
        with:
          name: firetvctl-${{ matrix.name }}
          path: release/*

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: cli
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - run: sha256sum release/* > release/SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          files: release/*
