name: Profile validation evidence
description: Submit redacted evidence for an exact Fire TV build
title: "[profile] "
labels: [profile-validation]
body:
  - type: markdown
    attributes:
      value: Never include serials, IP/MAC addresses, accounts, tokens, backups, APKs, or ADB keys.
  - type: input
    id: model
    attributes: { label: Model and codename }
    validations: { required: true }
  - type: input
    id: build
    attributes: { label: Redacted build fingerprint, Fire OS, SDK, ABI }
    validations: { required: true }
  - type: textarea
    id: checks
    attributes: { label: Validation results, description: Include Home, Settings, Appstore, accounts, keyboard, Bluetooth, HDMI, audio, playback, OTA, uninstall, and restore. }
    validations: { required: true }
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I manually reviewed every attachment for personal/device identifiers.
          required: true
